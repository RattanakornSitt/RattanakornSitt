<?xml version="1.0" encoding="UTF-8"?>
<!--
====================================================================

Polaris Design System

Component
Hero Banner — Dark

Version
2.0

Purpose
Dark-theme GitHub profile hero banner for Rattanakorn Sittisang.

Design language
Calm engineering system / data flow / structured technology.

====================================================================
-->

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1280"
    height="640"
    viewBox="0 0 1280 640"
    fill="none"
    role="img"
    aria-labelledby="hero-title hero-desc">

    <title id="hero-title">
        Rattanakorn Sittisang — Data Engineer · Software Engineer
    </title>

    <desc id="hero-desc">
        Dark engineering profile banner showing data flow, system architecture,
        analytics, and software engineering.
    </desc>

    <defs>

        <!-- Background grid -->
        <pattern
            id="grid"
            width="40"
            height="40"
            patternUnits="userSpaceOnUse">

            <path
                d="M40 0H0V40"
                stroke="#334155"
                stroke-width="1"
                opacity="0.32"/>
        </pattern>

        <!-- Blue ambient glow -->
        <radialGradient
            id="blue-glow"
            cx="0"
            cy="0"
            r="1"
            gradientUnits="userSpaceOnUse"
            gradientTransform="translate(1080 420) rotate(90) scale(280)">

            <stop
                offset="0"
                stop-color="#2563EB"
                stop-opacity="0.18"/>

            <stop
                offset="0.45"
                stop-color="#2563EB"
                stop-opacity="0.06"/>

            <stop
                offset="1"
                stop-color="#2563EB"
                stop-opacity="0"/>
        </radialGradient>

        <!-- System core -->
        <linearGradient
            id="core-gradient"
            x1="1180"
            y1="250"
            x2="1180"
            y2="390"
            gradientUnits="userSpaceOnUse">

            <stop
                stop-color="#1E293B"/>

            <stop
                offset="1"
                stop-color="#020617"/>
        </linearGradient>

        <!-- System line -->
        <linearGradient
            id="system-line"
            x1="900"
            y1="150"
            x2="1180"
            y2="470"
            gradientUnits="userSpaceOnUse">

            <stop
                stop-color="#60A5FA"/>

            <stop
                offset="0.5"
                stop-color="#2563EB"/>

            <stop
                offset="1"
                stop-color="#1D4ED8"/>
        </linearGradient>

        <!-- Arrow -->
        <marker
            id="arrow"
            viewBox="0 0 10 10"
            refX="8"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse">

            <path
                d="M0 0L10 5L0 10Z"
                fill="#60A5FA"/>
        </marker>

    </defs>


