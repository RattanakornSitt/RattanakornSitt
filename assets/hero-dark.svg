<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1280"
    height="640"
    viewBox="0 0 1280 640"
    role="img"
    aria-labelledby="title desc">

<title>
Rattanakorn Sittisang — Thoughtful Product Engineer
</title>

<desc>
Dark engineering blueprint hero banner representing product engineering,
system thinking, and human-centered software design.
</desc>


<!-- ========================================================== -->
<!-- BACKGROUND                                                 -->
<!-- ========================================================== -->

<rect
