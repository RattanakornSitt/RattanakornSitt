<svg
  width="1200"
  height="500"
  viewBox="0 0 1200 500"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient
      id="panelGradient"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >

      <stop
        stop-color="#FFFFFF"
        stop-opacity="0.07"
      />

      <stop
        offset="1"
        stop-color="#FFFFFF"
        stop-opacity="0.02"
      />

    </linearGradient>


    <linearGradient
      id="chartGradient"
      x1="300"
      y1="350"
      x2="850"
      y2="150"
      gradientUnits="userSpaceOnUse"
    >

      <stop
        stop-color="#FFFFFF"
        stop-opacity="0.08"
      />

      <stop
        offset="0.5"
        stop-color="#FFFFFF"
        stop-opacity="0.75"
      />

      <stop
        offset="1"
        stop-color="#FFFFFF"
        stop-opacity="0.15"
      />

    </linearGradient>


    <filter id="dashboardGlow">
      <feGaussianBlur
        stdDeviation="6"
      />
    </filter>

  </defs>


  <!-- Dashboard frame -->

  <rect
    x="120"
    y="60"
    width="960"
    height="380"
    rx="18"
    fill="url(#panelGradient)"
    stroke="#FFFFFF"
    stroke-opacity="0.14"
  />


  <!-- Header -->

  <line
    x1="120"
    y1="110"
    x2="1080"
    y2="110"
    stroke="#FFFFFF"
    stroke-opacity="0.1"
  />


  <!-- Header indicators -->

  <circle
    cx="165"
    cy="85"
    r="6"
    fill="#FFFFFF"
    opacity="0.45"
  />

  <circle
    cx="190"
    cy="85"
    r="6"
    fill="#FFFFFF"
    opacity="0.25"
  />

  <circle
    cx="215"
    cy="85"
    r="6"
    fill="#FFFFFF"
    opacity="0.15"
  />


  <!-- Metric cards -->

  <rect
    x="160"
    y="135"
    width="180"
    height="80"
    rx="10"
    stroke="#FFFFFF"
    stroke-opacity="0.1"
  />

  <rect
    x="360"
    y="135"
    width="180"
    height="80"
    rx="10"
    stroke="#FFFFFF"
    stroke-opacity="0.1"
  />

  <rect
    x="560"
    y="135"
    width="180"
    height="80"
    rx="10"
    stroke="#FFFFFF"
    stroke-opacity="0.1"
  />

