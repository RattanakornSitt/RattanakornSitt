    d="M185 180L210 172L230 180L250 160L275 166L300 150"
    stroke="#FFFFFF"
    stroke-opacity="0.55"
    stroke-width="2"
  />

  <path
    d="M385 182L410 180L430 165L450 170L475 150L510 158"
    stroke="#FFFFFF"
    stroke-opacity="0.4"
    stroke-width="2"
  />

  <path
    d="M585 175L610 180L635 160L660 168L685 145L710 152"
