    cy="350"
    r="5"
    fill="#FFFFFF"
    opacity="0.55"
  />

  <circle
    cx="430"
    cy="315"
    r="5"
    fill="#FFFFFF"
    opacity="0.65"
  />

  <circle
    cx="590"
