  <path
    d="M180 325H720"
    stroke="#FFFFFF"
    stroke-opacity="0.06"
  />

  <path
    d="M180 365H720"
    stroke="#FFFFFF"
    stroke-opacity="0.06"
  />


  <path
    d="M280 265V385"
    stroke="#FFFFFF"
    stroke-opacity="0.05"
