Version
4.0

Purpose
Reusable layered architecture geometry.

This file intentionally contains NO labels.

Labels belong to markdown content.

====================================================================
-->

<svg
  width="1200"
  height="520"
  viewBox="0 0 1200 520"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient
      id="layerGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >

      <stop
        stop-color="#FFFFFF"
        stop-opacity="0.05"
      />

      <stop
        offset="0.5"
        stop-color="#FFFFFF"
        stop-opacity="0.18"
      />

      <stop
        offset="1"
        stop-color="#FFFFFF"
        stop-opacity="0.05"
      />

    </linearGradient>


    <filter id="architectureGlow">
      <feGaussianBlur
        stdDeviation="6"
      />
    </filter>

  </defs>


  <!-- Layer containers -->

  <rect
    x="200"
    y="60"
    width="800"
    height="90"
    rx="14"
    stroke="url(#layerGradient)"
  />

  <rect
    x="200"
    y="190"
    width="800"
    height="90"
    rx="14"
    stroke="url(#layerGradient)"
  />

  <rect
    x="200"
    y="320"
    width="800"
    height="90"
    rx="14"
    stroke="url(#layerGradient)"
  />


  <!-- Layer connections -->

  <path
    d="M600 150V190"
    stroke="#FFFFFF"
    stroke-opacity="0.3"
  />

  <path
    d="M600 280V320"
    stroke="#FFFFFF"
    stroke-opacity="0.3"
  />


  <!-- Top layer nodes -->

  <circle
    cx="360"
    cy="105"
    r="10"
    fill="#FFFFFF"
    opacity="0.75"
  />

  <circle
    cx="600"
    cy="105"
    r="10"
    fill="#FFFFFF"
    opacity="0.85"
  />

  <circle
    cx="840"
    cy="105"
    r="10"
    fill="#FFFFFF"
    opacity="0.75"
  />


  <!-- Middle layer nodes -->

  <circle
    cx="420"
    cy="235"
    r="10"
    fill="#FFFFFF"
    opacity="0.75"
  />

  <circle
    cx="600"
    cy="235"
    r="10"
    fill="#FFFFFF"
    opacity="0.9"
  />

  <circle
    cx="780"
    cy="235"
    r="10"
    fill="#FFFFFF"
    opacity="0.75"
  />


  <!-- Bottom layer nodes -->

  <circle
    cx="360"
    cy="365"
    r="10"
    fill="#FFFFFF"
    opacity="0.75"
  />

  <circle
    cx="600"
    cy="365"
    r="10"
    fill="#FFFFFF"
    opacity="0.9"
  />

  <circle
    cx="840"
    cy="365"
    r="10"
    fill="#FFFFFF"
    opacity="0.75"
  />


  <!-- Data pathways -->

  <path
    d="
    M360 115
    C360 170 420 180 420 225
    "
    stroke="#FFFFFF"
    stroke-opacity="0.15"
  />

  <path
    d="
    M840 115
    C840 170 780 180 780 225
    "
    stroke="#FFFFFF"
    stroke-opacity="0.15"
  />


  <!-- Core architecture signal -->

  <circle
    cx="600"
    cy="235"
    r="40"
    stroke="#FFFFFF"
    stroke-opacity="0.1"
    filter="url(#architectureGlow)"
  />


</svg>