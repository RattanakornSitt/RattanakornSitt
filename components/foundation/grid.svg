<?xml version="1.0" encoding="UTF-8"?>

<!--
──────────────────────────────────────────────────────────────

Polaris Design System

Foundation Grid System

Version 1.0

Designed & Engineered by Prae

This SVG defines the reusable engineering grid used
across every illustration inside Polaris Design System.

The grid is intentionally subtle.

It exists to support information—not decoration.

──────────────────────────────────────────────────────────────
-->

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1280"
    height="640"
    viewBox="0 0 1280 640"
    role="img"
    aria-labelledby="title desc">

<title>
Polaris Design System — Foundation Grid
</title>

<desc>
Reusable engineering grid based on an eight point spacing
system for GitHub profile graphics.
</desc>

<defs>

    <!-- ================================================== -->
    <!-- COLORS                                             -->
    <!-- ================================================== -->

    <style>

        .background{
            fill:#FAFAF9;
        }

        .major-grid{
            stroke:#CBD5E1;
            stroke-width:1;
            opacity:.55;
        }

        .minor-grid{
            stroke:#E5E7EB;
            stroke-width:.5;
            opacity:.35;
        }

        .margin{
            stroke:#2563EB;
            stroke-width:1.5;
            stroke-dasharray:8 8;
            opacity:.7;
        }

    </style>

    <!-- ================================================== -->
    <!-- 8px GRID                                           -->
    <!-- ================================================== -->

    <pattern
        id="minorGrid"
        width="8"
        height="8"
        patternUnits="userSpaceOnUse">

        <path
            d="M 8 0 L 0 0 0 8"
            class="minor-grid"/>

    </pattern>

    <!-- ================================================== -->
    <!-- 64px GRID                                          -->
    <!-- ================================================== -->

    <pattern
        id="majorGrid"
        width="64"
        height="64"
        patternUnits="userSpaceOnUse">

        <rect
            width="64"
            height="64"
            fill="url(#minorGrid)"/>

        <path
            d="M 64 0 L 0 0 0 64"
            class="major-grid"/>

    </pattern>

</defs>

<!-- ====================================================== -->
<!-- CANVAS                                                 -->
<!-- ====================================================== -->

<rect
    width="1280"
    height="640"
    class="background"/>

<rect
    width="1280"
    height="640"
    fill="url(#majorGrid)"/>

<!-- ====================================================== -->
<!-- SAFE MARGIN                                            -->
<!-- ====================================================== -->

<rect
    x="80"
    y="80"
    width="1120"
    height="480"
    fill="none"
    class="margin"/>

<!-- ====================================================== -->
<!-- CENTER GUIDE                                           -->
<!-- ====================================================== -->

<line
    x1="640"
    y1="0"
    x2="640"
    y2="640"
    class="major-grid"/>

<line
    x1="0"
    y1="320"
    x2="1280"
    y2="320"
    class="major-grid"/>

<!-- ====================================================== -->
<!-- LABEL                                                  -->
<!-- ====================================================== -->

<text
    x="96"
    y="48"
    font-family="IBM Plex Mono"
    font-size="12"
    fill="#64748B">

Polaris Design System — Foundation Grid

</text>

</svg>