<?xml version="1.0" encoding="UTF-8"?>
<!--
====================================================================

Polaris Design System

Component
Engineering Grid Background

Version
4.0

Purpose
Reusable technical background geometry.

This file intentionally contains NO labels.

Labels belong to markdown content.

====================================================================
-->

<svg
  width="1200"
  height="600"
  viewBox="0 0 1200 600"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M40 0H0V40"
        stroke="#FFFFFF"
        stroke-opacity="0.08"
        stroke-width="1"
      />
    </pattern>


    <radialGradient
      id="fade"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(600 300) rotate(90) scale(350 700)"
    >
      <stop
        stop-color="#FFFFFF"
        stop-opacity="0.12"
      />

      <stop
        offset="1"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />
    </radialGradient>

  </defs>


  <!-- Engineering grid -->
  <rect
    width="1200"
    height="600"
    fill="url(#grid)"
  />


  <!-- Soft system field -->
  <rect
    width="1200"
    height="600"
    fill="url(#fade)"
  />


  <!-- Reference nodes -->

  <circle
    cx="120"
    cy="120"
    r="3"
    fill="#FFFFFF"
    opacity="0.35"
  />

  <circle
    cx="1080"
    cy="480"
    r="3"
    fill="#FFFFFF"
    opacity="0.35"
  />


</svg>