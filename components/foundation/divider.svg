<?xml version="1.0" encoding="UTF-8"?>
<!--
====================================================================

Polaris Design System

Component
Section Divider

Version
4.0

Purpose
Reusable visual separator for GitHub profile sections.

This file intentionally contains NO labels.

Labels belong to markdown content.

====================================================================
-->

<svg
  width="1200"
  height="120"
  viewBox="0 0 1200 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>
    <linearGradient id="lineGradient" x1="0" y1="60" x2="1200" y2="60">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8B8B8B" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#8B8B8B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>


  <!-- Ambient glow -->
  <path
    d="M200 60H1000"
    stroke="url(#accentGradient)"
    stroke-width="8"
    opacity="0.12"
    filter="url(#glow)"
  />


  <!-- Main divider -->
  <path
    d="M80 60H1120"
    stroke="url(#lineGradient)"
    stroke-width="1"
  />


  <!-- Center node -->
  <circle
    cx="600"
    cy="60"
    r="5"
    fill="#FFFFFF"
    opacity="0.9"
  />

  <circle
    cx="600"
    cy="60"
    r="12"
    stroke="#FFFFFF"
    stroke-opacity="0.15"
  />


  <!-- Technical nodes -->
  <circle
    cx="420"
    cy="60"
    r="2"
    fill="#FFFFFF"
    opacity="0.5"
  />

  <circle
    cx="780"
    cy="60"
    r="2"
    fill="#FFFFFF"
    opacity="0.5"
  />

</svg>