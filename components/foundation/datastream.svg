<?xml version="1.0" encoding="UTF-8"?>
<!--
====================================================================

Polaris Design System

Component
Data Stream

Version
4.0

Purpose
Reusable data flow geometry.

This file intentionally contains NO labels.

Labels belong to markdown content.

====================================================================
-->

<svg
  width="1200"
  height="320"
  viewBox="0 0 1200 320"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient
      id="streamGradient"
      x1="0"
      y1="160"
      x2="1200"
      y2="160"
    >

      <stop
        stop-color="#FFFFFF"
        stop-opacity="0"
      />

      <stop
        offset="0.25"
        stop-color="#FFFFFF"
        stop-opacity="0.35"
      />

      <stop
        offset="0.5"
        stop-color="#FFFFFF"
        stop-opacity="0.9"
      />

      <stop
        offset="0.75"
        stop-color="#FFFFFF"
        stop-opacity="0.35"
      />

      <stop
        offset="1"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />

    </linearGradient>


    <filter id="streamGlow">
      <feGaussianBlur
        stdDeviation="5"
      />
    </filter>

  </defs>


  <!-- Background flow field -->

  <path
    d="
    M0 160
    C180 80 260 240 420 160
    C580 80 660 240 820 160
    C980 80 1080 220 1200 160
    "
    stroke="#FFFFFF"
    stroke-opacity="0.08"
    stroke-width="12"
    filter="url(#streamGlow)"
  />


  <!-- Main stream -->

  <path
    d="
    M0 160
    C180 80 260 240 420 160
    C580 80 660 240 820 160
    C980 80 1080 220 1200 160
    "
    stroke="url(#streamGradient)"
    stroke-width="2"
  />


  <!-- Data packets -->

  <circle
    cx="180"
    cy="118"
    r="7"
    fill="#FFFFFF"
    opacity="0.7"
  />

  <circle
    cx="420"
    cy="160"
    r="8"
    fill="#FFFFFF"
    opacity="0.85"
  />

  <circle
    cx="650"
    cy="118"
    r="7"
    fill="#FFFFFF"
    opacity="0.7"
  />

  <circle
    cx="820"
    cy="160"
    r="8"
    fill="#FFFFFF"
    opacity="0.85"
  />

  <circle
    cx="1040"
    cy="190"
    r="7"
    fill="#FFFFFF"
    opacity="0.7"
  />


  <!-- Processing rings -->

  <circle
    cx="420"
    cy="160"
    r="28"
    stroke="#FFFFFF"
    stroke-opacity="0.15"
  />

  <circle
    cx="820"
    cy="160"
    r="28"
    stroke="#FFFFFF"
    stroke-opacity="0.15"
  />


  <!-- Small telemetry nodes -->

  <circle
    cx="300"
    cy="90"
    r="3"
    fill="#FFFFFF"
    opacity="0.35"
  />

  <circle
    cx="730"
    cy="220"
    r="3"
    fill="#FFFFFF"
    opacity="0.35"
  />

  <circle
    cx="960"
    cy="110"
    r="3"
    fill="#FFFFFF"
    opacity="0.35"
  />


</svg>