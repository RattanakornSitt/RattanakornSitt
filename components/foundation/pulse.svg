<?xml version="1.0" encoding="UTF-8"?>
<!--
====================================================================

Polaris Design System

Component
System Pulse

Version
4.0

Purpose
Reusable operational signal geometry.

This file intentionally contains NO labels.

Labels belong to markdown content.

====================================================================
-->

<svg
  width="1200"
  height="260"
  viewBox="0 0 1200 260"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient
      id="pulseGradient"
      x1="0"
      y1="130"
      x2="1200"
      y2="130"
    >

      <stop
        stop-color="#FFFFFF"
        stop-opacity="0"
      />

      <stop
        offset="0.35"
        stop-color="#FFFFFF"
        stop-opacity="0.35"
      />

      <stop
        offset="0.5"
        stop-color="#FFFFFF"
        stop-opacity="1"
      />

      <stop
        offset="0.65"
        stop-color="#FFFFFF"
        stop-opacity="0.35"
      />

      <stop
        offset="1"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />

    </linearGradient>


    <filter id="pulseGlow">
      <feGaussianBlur
        stdDeviation="6"
      />
    </filter>


  </defs>


  <!-- Ambient heartbeat -->

  <path
    d="
    M0 130
    H260
    L330 130
    L390 70
    L450 190
    L510 130
    H690
    L750 100
    L810 160
    L870 130
    H1200
    "
    stroke="#FFFFFF"
    stroke-opacity="0.15"
    stroke-width="12"
    filter="url(#pulseGlow)"
  />


  <!-- Main pulse -->

  <path
    d="
    M0 130
    H260
    L330 130
    L390 70
    L450 190
    L510 130
    H690
    L750 100
    L810 160
    L870 130
    H1200
    "
    stroke="url(#pulseGradient)"
    stroke-width="2"
  />


  <!-- Active points -->

  <circle
    cx="390"
    cy="70"
    r="7"
    fill="#FFFFFF"
  />

  <circle
    cx="450"
    cy="190"
    r="7"
    fill="#FFFFFF"
  />

  <circle
    cx="750"
    cy="100"
    r="7"
    fill="#FFFFFF"
  />

  <circle
    cx="810"
    cy="160"
    r="7"
    fill="#FFFFFF"
  />


  <!-- Monitoring rings -->

  <circle
    cx="600"
    cy="130"
    r="18"
    stroke="#FFFFFF"
    stroke-opacity="0.15"
  />

  <circle
    cx="600"
    cy="130"
    r="4"
    fill="#FFFFFF"
  />


</svg>