<?xml version="1.0" encoding="UTF-8"?>
<!--
====================================================================

Polaris Design System

Component
Data Storage

Version
4.0

Purpose
Reusable database and storage geometry.

This file intentionally contains NO labels.

Labels belong to markdown content.

====================================================================
-->

<svg
  width="1200"
  height="440"
  viewBox="0 0 1200 440"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient
      id="databaseBody"
      x1="300"
      y1="90"
      x2="900"
      y2="350"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        stop-color="#FFFFFF"
        stop-opacity="0.04"
      />

      <stop
        offset="0.5"
        stop-color="#FFFFFF"
        stop-opacity="0.15"
      />

      <stop
        offset="1"
        stop-color="#FFFFFF"
        stop-opacity="0.04"
      />
    </linearGradient>


    <linearGradient
      id="storageLine"
      x1="250"
      y1="220"
      x2="950"
      y2="220"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        stop-color="#FFFFFF"
        stop-opacity="0.04"
      />

      <stop
        offset="0.5"
        stop-color="#FFFFFF"
        stop-opacity="0.5"
      />

      <stop
        offset="1"
        stop-color="#FFFFFF"
        stop-opacity="0.04"
      />
    </linearGradient>


    <filter id="databaseGlow">
      <feGaussianBlur
        stdDeviation="7"
      />
    </filter>

  </defs>


  <!-- Storage body -->

  <path
    d="
      M300 100
      C300 76 434 58 600 58
      C766 58 900 76 900 100
      V340
      C900 364 766 382 600 382
      C434 382 300 364 300 340
      Z
    "
    fill="url(#databaseBody)"
    stroke="#FFFFFF"
    stroke-opacity="0.14"
  />


  <!-- Top surface -->

  <ellipse
    cx="600"
    cy="100"
    rx="300"
    ry="42"
    stroke="#FFFFFF"
    stroke-opacity="0.25"
    stroke-width="2"
  />


  <ellipse
    cx="600"
    cy="100"
    rx="245"
    ry="28"
    stroke="#FFFFFF"
    stroke-opacity="0.08"
  />


  <!-- Storage layers -->

  <path
    d="
      M300 180
      C300 204 434 222 600 222
      C766 222 900 204 900 180
    "
    stroke="#FFFFFF"
    stroke-opacity="0.13"
  />

  <path
    d="
      M300 260
      C300 284 434 302 600 302
      C766 302 900 284 900 260
    "
    stroke="#FFFFFF"
    stroke-opacity="0.13"
  />


  <!-- Central storage spine -->

  <path
    d="M600 100V340"
    stroke="url(#storageLine)"
    stroke-width="1"
  />


  <!-- Data access connections -->

  <path
    d="M180 220H300"
    stroke="url(#storageLine)"
    stroke-width="2"
  />

  <path
    d="M900 220H1020"
    stroke="url(#storageLine)"
    stroke-width="2"
  />


  <!-- Access nodes -->

  <circle
    cx="180"
    cy="220"
    r="8"
    fill="#FFFFFF"
    opacity="0.65"
  />

  <circle
    cx="1020"
    cy="220"
    r="8"
    fill="#FFFFFF"
    opacity="0.65"
  />


  <!-- Core storage node -->

  <circle
    cx="600"
    cy="220"
    r="10"
    fill="#FFFFFF"
    opacity="0.9"
  />

  <circle
    cx="600"
    cy="220"
    r="34"
    stroke="#FFFFFF"
    stroke-opacity="0.1"
    filter="url(#databaseGlow)"
  />


  <!-- Schema indicators -->

  <circle
    cx="440"
    cy="180"
    r="4"
    fill="#FFFFFF"
    opacity="0.4"
  />

  <circle
    cx="760"
    cy="180"
    r="4"
    fill="#FFFFFF"
    opacity="0.4"
  />

  <circle
    cx="440"
    cy="260"
    r="4"
    fill="#FFFFFF"
    opacity="0.4"
  />

  <circle
    cx="760"
    cy="260"
    r="4"
    fill="#FFFFFF"
    opacity="0.4"
  />

</svg>