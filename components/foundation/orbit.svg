<?xml version="1.0" encoding="UTF-8"?>
<!--
====================================================================

Polaris Design System

Component
Orbit System

Version
4.0

Purpose
Reusable engineering ecosystem geometry.

This file intentionally contains NO labels.

Labels belong to markdown content.

====================================================================
-->

<svg
  width="1200"
  height="500"
  viewBox="0 0 1200 500"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <radialGradient
      id="coreGlow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(600 250) scale(120)"
    >
      <stop
        stop-color="#FFFFFF"
        stop-opacity="0.25"
      />

      <stop
        offset="1"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />

    </radialGradient>


    <linearGradient
      id="orbitLine"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        stop-color="#FFFFFF"
        stop-opacity="0.08"
      />

      <stop
        offset="0.5"
        stop-color="#FFFFFF"
        stop-opacity="0.35"
      />

      <stop
        offset="1"
        stop-color="#FFFFFF"
        stop-opacity="0.08"
      />

    </linearGradient>


    <filter id="blur">
      <feGaussianBlur
        stdDeviation="8"
      />
    </filter>

  </defs>


  <!-- Core energy -->

  <circle
    cx="600"
    cy="250"
    r="120"
    fill="url(#coreGlow)"
  />


  <!-- Orbit paths -->

  <ellipse
    cx="600"
    cy="250"
    rx="300"
    ry="110"
    stroke="url(#orbitLine)"
    stroke-width="1"
  />

  <ellipse
    cx="600"
    cy="250"
    rx="220"
    ry="220"
    stroke="url(#orbitLine)"
    stroke-width="1"
    stroke-opacity="0.6"
  />

  <ellipse
    cx="600"
    cy="250"
    rx="420"
    ry="170"
    stroke="url(#orbitLine)"
    stroke-width="1"
    stroke-opacity="0.4"
  />


  <!-- Central core -->

  <circle
    cx="600"
    cy="250"
    r="24"
    fill="#FFFFFF"
  />

  <circle
    cx="600"
    cy="250"
    r="45"
    stroke="#FFFFFF"
    stroke-opacity="0.15"
    filter="url(#blur)"
  />


  <!-- Orbit nodes -->

  <circle
    cx="300"
    cy="250"
    r="7"
    fill="#FFFFFF"
    opacity="0.8"
  />

  <circle
    cx="900"
    cy="250"
    r="7"
    fill="#FFFFFF"
    opacity="0.8"
  />

  <circle
    cx="600"
    cy="30"
    r="7"
    fill="#FFFFFF"
    opacity="0.8"
  />

  <circle
    cx="600"
    cy="470"
    r="7"
    fill="#FFFFFF"
    opacity="0.8"
  />


  <!-- Secondary nodes -->

  <circle
    cx="420"
    cy="95"
    r="4"
    fill="#FFFFFF"
    opacity="0.45"
  />

  <circle
    cx="780"
    cy="405"
    r="4"
    fill="#FFFFFF"
    opacity="0.45"
  />

  <circle
    cx="850"
    cy="120"
    r="4"
    fill="#FFFFFF"
    opacity="0.45"
  />

  <circle
    cx="350"
    cy="380"
    r="4"
    fill="#FFFFFF"
    opacity="0.45"
  />


</svg>