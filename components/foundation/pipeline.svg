<?xml version="1.0" encoding="UTF-8"?>
<!--
====================================================================

Polaris Design System

Component
Pipeline Flow

Version
4.0

Purpose
Reusable engineering workflow geometry.

This file intentionally contains NO labels.

Labels belong to markdown content.

====================================================================
-->

<svg
  width="1200"
  height="260"
  viewBox="0 0 1200 260"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient
      id="flowGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        stop-color="#FFFFFF"
        stop-opacity="0.1"
      />

      <stop
        offset="0.5"
        stop-color="#FFFFFF"
        stop-opacity="0.8"
      />

      <stop
        offset="1"
        stop-color="#FFFFFF"
        stop-opacity="0.1"
      />

    </linearGradient>


    <filter id="pipelineGlow">
      <feGaussianBlur
        stdDeviation="5"
      />
    </filter>

  </defs>


  <!-- Flow line glow -->

  <path
    d="
    M120 130
    H1080
    "
    stroke="#FFFFFF"
    stroke-opacity="0.12"
    stroke-width="10"
    filter="url(#pipelineGlow)"
  />


  <!-- Main pipeline -->

  <path
    d="
    M120 130
    H1080
    "
    stroke="url(#flowGradient)"
    stroke-width="2"
  />


  <!-- Processing stages -->

  <circle
    cx="180"
    cy="130"
    r="24"
    stroke="#FFFFFF"
    stroke-opacity="0.2"
  />

  <circle
    cx="420"
    cy="130"
    r="24"
    stroke="#FFFFFF"
    stroke-opacity="0.2"
  />

  <circle
    cx="660"
    cy="130"
    r="24"
    stroke="#FFFFFF"
    stroke-opacity="0.2"
  />

  <circle
    cx="900"
    cy="130"
    r="24"
    stroke="#FFFFFF"
    stroke-opacity="0.2"
  />


  <!-- Stage cores -->

  <circle
    cx="180"
    cy="130"
    r="8"
    fill="#FFFFFF"
  />

  <circle
    cx="420"
    cy="130"
    r="8"
    fill="#FFFFFF"
  />

  <circle
    cx="660"
    cy="130"
    r="8"
    fill="#FFFFFF"
  />

  <circle
    cx="900"
    cy="130"
    r="8"
    fill="#FFFFFF"
  />


  <!-- Data pulses -->

  <circle
    cx="300"
    cy="130"
    r="4"
    fill="#FFFFFF"
    opacity="0.6"
  />

  <circle
    cx="540"
    cy="130"
    r="4"
    fill="#FFFFFF"
    opacity="0.6"
  />

  <circle
    cx="780"
    cy="130"
    r="4"
    fill="#FFFFFF"
    opacity="0.6"
  />


  <!-- Terminal endpoints -->

  <path
    d="
    M100 130
    L120 120
    M100 130
    L120 140
    "
    stroke="#FFFFFF"
    stroke-opacity="0.4"
    stroke-width="2"
  />

  <path
    d="
    M1100 130
    L1080 120
    M1100 130
    L1080 140
    "
    stroke="#FFFFFF"
    stroke-opacity="0.4"
    stroke-width="2"
  />


</svg>