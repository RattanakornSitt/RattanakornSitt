<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1120"
    height="24"
    viewBox="0 0 1120 24"
    role="img"
    aria-labelledby="title desc">

<title>
Polaris Divider
</title>

<desc>
A reusable engineering divider component consisting of
balanced horizontal rules and a central focus marker.
</desc>

<!-- ====================================================== -->
<!-- LEFT LINE                                               -->
<!-- ====================================================== -->

<line
    x1="0"
    y1="12"
    x2="536"
    y2="12"
    stroke="#CBD5E1"
    stroke-width="1.5"
    stroke-linecap="round"/>

<!-- ====================================================== -->
<!-- CENTER MARKER                                           -->
<!-- ====================================================== -->

<circle
    cx="560"
    cy="12"
    r="4"
    fill="#2563EB"/>

<circle
    cx="560"
    cy="12"
    r="8"
    fill="none"
    stroke="#CBD5E1"
    stroke-width="1"/>

<!-- ====================================================== -->
<!-- RIGHT LINE                                              -->
<!-- ====================================================== -->

<line
    x1="584"
    y1="12"
    x2="1120"
    y2="12"
    stroke="#CBD5E1"
    stroke-width="1.5"
    stroke-linecap="round"/>

</svg>